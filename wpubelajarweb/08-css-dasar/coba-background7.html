<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multiple Background</title>
  
  <style>
  
  body{
    min-height: 100vh;
    font-family: arial;
    background-color: grey;
  }
    
    .frame {
      width: 400px;
      height: 400px;
      border: 10px solid white;
      margin: auto;
      background-image: url("image/kucing2.png"), url("image/logo.png"), url("image/tanah.png");
      background-size: 320px, 400px, 400px;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-position: center 80px, center 70%, bottom center;
      background-color: ivory;
      border-radius: 50%;
    }
    
    h1 {
      color: white;
      text-align: center;
      font-family: arial;
      font-size: 50px;
    }
    
  </style>
  
</head>

<body>
  
  <h1>My Profile Cat</h1>
  <div class="frame">
    
  </div>
  
</body>

</html>
