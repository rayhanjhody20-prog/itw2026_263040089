<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Text - Decoration & Transform</title>
  
  <style>
    h1 {
      font-size: 40px;
      text-align: center;
      text-transform: uppercase;
      text-decoration: underline overline;
      text-decoration-style: wavy;
      text-decoration-color: lightblue;
      text-decoration-skip-ink: none;
    }

    h2 {
      font-size: 30px;
      text-align: right;
      color: crimson;
    }

    p {
      font-size: 26px;
      font-family: Arial, Helvetica, sans-serif;
      text-align: justify;
    }
  </style>
  
</head>

<body>
  
  <h1>Hello, CSS!</h1>

  <h2>Belajar Web di WPUCourse.id</h2>

  <p>Pagi ini matahari bersinar sangat cerah menghangatkan seluruh isi bumi. Burung kecil bernyanyi merdu menyambut datangnya hari yang penuh harapan. Angin berhembus pelan menyapa pepohonan hijau di sekitar halaman rumahku.</p>
  
</body>

</html>
